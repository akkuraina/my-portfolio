<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ocean Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031A24" />
      <stop offset="50%" stop-color="#020B10" />
      <stop offset="100%" stop-color="#072D38" />
    </linearGradient>

    <!-- Electric Cyan Glow Ring -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19D3C5" />
      <stop offset="100%" stop-color="#0EA5C6" />
    </linearGradient>

    <!-- Radial Glow Overlay -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#19D3C5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#19D3C5" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#19D3C5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <rect width="512" height="512" rx="128" fill="url(#glow)" />

  <!-- Luminous Electric Cyan Ring Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#cyanGrad)" stroke-width="14" opacity="0.85" filter="url(#shadow)" />

  <!-- Inner Subtle Accent Hairline -->
  <rect x="40" y="40" width="432" height="432" rx="88" fill="none" stroke="#093340" stroke-width="4" />

  <!-- Monogram Text AR -->
  <text 
    x="50%" 
    y="55%" 
    dominant-baseline="central" 
    text-anchor="middle" 
    font-family="'Fraunces', Georgia, serif" 
    font-size="220" 
    font-weight="800" 
    letter-spacing="-6" 
    fill="#F3F1E8"
  >AR</text>

  <!-- Electric Cyan Dot Accent -->
  <circle cx="390" cy="350" r="22" fill="#19D3C5" />
</svg>
